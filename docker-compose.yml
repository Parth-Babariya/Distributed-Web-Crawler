x-app-env: &app-env
  REDIS_HOST: redis
  MONGO_HOST: mongodb
  MONGO_REPLICA_SET: rs0
  CRAWLER_CONTENT_STORE: s3
  S3_BUCKET: crawler-html
  S3_ENDPOINT_URL: http://s3:8333
  AWS_ACCESS_KEY_ID: crawler
  AWS_SECRET_ACCESS_KEY: crawler-secret
  AWS_REGION: us-east-1

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker/mongo-init:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "/docker/mongo-init/01-init-replica.js"]
      interval: 5s
      timeout: 10s
      retries: 20

  # S3-compatible blob store for compressed HTML. MinIO stopped publishing
  # container images in late 2025, so this runs SeaweedFS's S3 gateway; the
  # crawler only speaks plain S3 through boto3.
  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # filer web UI (browse /buckets/crawler-html)
    volumes:
      - s3_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  crawler-worker:
    build: .
    command: ["python", "src/v3/worker_v3.py", "--max-pages", "30", "--idle-timeout", "120", "--batch-size", "5", "--concurrency", "8"]
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      s3:
        condition: service_healthy
    restart: "no"

  streaming-indexer:
    build: .
    command: ["python", "streaming_indexer.py", "--sleep", "1", "--max-events", "50"]
    environment:
      <<: *app-env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  pagerank-worker:
    build: .
    command: ["python", "pagerank_worker.py", "--sleep", "1", "--max-events", "25", "--max-pushes", "200"]
    environment:
      <<: *app-env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  search-api:
    build: .
    command: ["python", "-m", "uvicorn", "search.search_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build: .
    command: ["python", "scripts/seed_from_file.py", "--file", "seed_urls.txt"]
    profiles: ["tools"]
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  mongo_data:
  s3_data:
